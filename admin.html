<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reservations | Masala Junction Admin</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <a class="brand footer-brand" href="/" aria-label="Back to Masala Junction website">
        <span class="brand-mark" aria-hidden="true">MJ</span>
        <span>
          <strong>Masala Junction</strong>
          <small>Reservations Admin</small>
        </span>
      </a>
      <div class="admin-actions">
        <a class="btn btn-ghost admin-site-link" href="/">View Site</a>
        <button class="btn" type="button" data-refresh-reservations>Refresh</button>
        <button class="btn btn-ghost admin-site-link" type="button" data-admin-logout>Sign out</button>
      </div>
    </header>

    <section class="admin-card" aria-labelledby="admin-title">
      <div class="admin-card-head">
        <div>
          <p class="eyebrow">Backend Dashboard</p>
          <h1 id="admin-title">Reservation Requests</h1>
          <p>Approving a request automatically sends the customer an email confirmation when Gmail is configured.</p>
        </div>
        <p data-admin-count>Loading...</p>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Guest</th>
              <th>Contact</th>
              <th>Date</th>
              <th>Time</th>
              <th>Guests</th>
              <th>Note</th>
              <th>Status</th>
              <th>Confirm</th>
            </tr>
          </thead>
          <tbody data-reservations-table>
            <tr>
              <td colspan="9">Loading reservations...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="form-status" data-admin-status aria-live="polite"></p>
    </section>
  </main>

  <script src="admin.js" defer></script>
</body>
</html>
